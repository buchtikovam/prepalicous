name: 🦄 Prepalicous quality gate

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        name: Verify web and Android
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            PUBLIC_APP_NAME: Prepalicous CI
            PUBLIC_APPWRITE_ENDPOINT: https://example.invalid/v1
            PUBLIC_APPWRITE_PROJECT_ID: ci-project
            PUBLIC_APPWRITE_DATABASE_ID: ci-database

        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting, lint, and types
              run: npm run code:check

            - name: Run unit tests
              run: npm run test:unit -- --run

            - name: Check unit-test coverage
              run: npm run test:coverage

            - name: Build the shared static artifact
              run: npm run development:build

            - name: Verify static artifact
              run: test -f build/index.html

            - name: Install Chromium and system dependencies
              run: npx playwright install --with-deps chromium

            - name: Run browser smoke test
              run: npm run test:e2e

            - name: Set up Java for Android
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Sync the shared artifact to Android
              run: npx cap sync android

            - name: Package Android debug app
              working-directory: android
              run: bash ./gradlew :app:assembleDebug
